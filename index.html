<!doctype html>
<html lang="en" data-theme="workspace-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Generated from src/assets/logo/marks.json by scripts/build-favicon.mjs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Jasmeet Singh Wadhwa</title>
    <script>
      // Apply the saved theme, or Workspace Blue on a first visit, before first paint.
      // Ids match src/themes/themes.ts.
      (function () {
        var ids = ["workspace-blue", "daylight", "floodlight", "high-contrast", "solarized-dark"];
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (ids.indexOf(theme) < 0) theme = "workspace-blue";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
